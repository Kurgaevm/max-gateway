services:
  maxgateway:
    build:
      context: .
      args:
        # Канал VK (личные страницы): playwright+chromium, ~500МБ. 0 — сборка без ВК.
        INSTALL_VK: ${INSTALL_VK:-1}
    container_name: maxgateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./data:/data
    environment:
      GATEWAY_API_KEY: ${MAXGW_API_KEY}
      WEBHOOK_URL: ${MAXGW_WEBHOOK_URL:-}
      PHONE: ${MAXGW_PHONE:-}
      STT_BASE_URL: ${STT_BASE_URL:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-whisper-1}
      REG_FIRST_NAME: ${MAXGW_REG_FIRST:-Maomao}
      REG_LAST_NAME: ${MAXGW_REG_LAST:-Test}
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
      MAXGW_HTTP_USER: ${MAXGW_HTTP_USER:-admin}
      MAXGW_HTTP_PASS: ${MAXGW_HTTP_PASS:-}
      WORK_DIR: /data
      SESSION_NAME: maxgw.db
      LOG_LEVEL: INFO
      PYMAX_LOG_LEVEL: INFO
    networks:
      - default

networks:
  default:
    name: maxgateway_default
